name: Journal registry diagnostic

on:
  push:
    branches: [diagnostics/journal-registry-c2-20261111-1]
    paths:
      - .github/workflows/journal-registry-diagnostic.yml
      - .github/scripts/journal-registry-*.py
      - .github/scripts/test-journal-registry-*.py

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  build-and-capture-fresh-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DIAGNOSTIC_TAG: diagnostic-c2-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Test sanitized capture and publication boundaries
        run: |
          python3 .github/scripts/test-journal-registry-diagnostic.py
          python3 .github/scripts/test-journal-registry-upload.py
      - uses: actions/checkout@v4
        with:
          ref: a47ac0f27045dfff361eaca481eda3190d5d5590
          path: candidate
      - name: Verify frozen source identity
        shell: bash
        run: |
          test "$(git -C candidate rev-parse HEAD)" = a47ac0f27045dfff361eaca481eda3190d5d5590
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = 3c4a3f5c2c7b26f7de61eb0205b77fda7d2ac35c
          test -z "$(git -C candidate status --porcelain)"
          test "$(sha256sum candidate/journal/Cargo.lock | cut -d' ' -f1)" = d69e38d29ecabd5ae3d62cf2a7c018b292a9e3a40102a0547971bf0d03e34854
      - uses: actions/download-artifact@v4
        with:
          name: ledger-qualified-wasmer-kernel
          run-id: 43102633269
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate/target/qualified-kernel
      - name: Build canonical exact-C2 image with existing qualified AOT
        env:
          CONTAINER_RUNTIME: docker
        run: |
          cd candidate
          journal/scripts/check-wasmer-kernel-provenance.py target/qualified-kernel a47ac0f27045dfff361eaca481eda3190d5d5590
          test "$(sha256sum target/qualified-kernel/kernel.wasmer | cut -d' ' -f1)" = 0c6b7fb7f94e1465e96617c28ebe6e216b4a71687062c8ca283bf4a10ad7416f
          journal/scripts/build-journal-image --variant musl \
            --kernel target/qualified-kernel/kernel.wasmer \
            --tag "ghcr.io/plurality-run/sync-web/journal-sdk:$DIAGNOSTIC_TAG" \
            --evidence-dir "$GITHUB_WORKSPACE/evidence/build"
          docker image save -o "$RUNNER_TEMP/journal-diagnostic.tar" \
            "ghcr.io/plurality-run/sync-web/journal-sdk:$DIAGNOSTIC_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: journal-registry-oci-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/journal-diagnostic.tar
          if-no-files-found: error
          compression-level: 0
      - name: Verify complete attested graph and capture registry operations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIAGNOSTIC_ARCHIVE: ${{ runner.temp }}/journal-diagnostic.tar
          DIAGNOSTIC_OUTPUT: evidence/registry-upload.json
        run: python3 .github/scripts/journal-registry-upload.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-registry-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
