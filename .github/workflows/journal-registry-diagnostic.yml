name: Journal registry diagnostic

on:
  push:
    branches: [diagnostics/journal-registry-c2-20261111-1]
    paths:
      - .github/workflows/journal-registry-diagnostic.yml
      - .github/scripts/journal-registry-*.py
      - .github/scripts/test-journal-registry-*.py

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  read-only-retained-graph-and-normal-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test capture and read-only boundaries
        run: |
          python3 .github/scripts/test-journal-registry-diagnostic.py
          python3 .github/scripts/test-journal-registry-upload.py
          python3 .github/scripts/test-journal-registry-readback.py
      - uses: actions/download-artifact@v4
        with:
          name: journal-registry-oci-archive-43122208660-1
          run-id: 43122208660
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: retained-image
      - name: Verify exact retained canonical C2 archive
        run: |
          test "$(sha256sum retained-image/journal-diagnostic.tar | cut -d' ' -f1)" = 00c814293cd992bc4766be8781abb4d817d1c61e9a1eafa23ede51eb8c656e8c
      - name: Read complete graph then normal Docker pull and offline runtime smoke
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIAGNOSTIC_ARCHIVE: retained-image/journal-diagnostic.tar
          DIAGNOSTIC_OUTPUT: evidence/registry-readback.json
        run: python3 .github/scripts/journal-registry-readback.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-registry-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
