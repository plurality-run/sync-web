name: Social Agent

on:
  workflow_call:
    inputs:
      release:
        description: Explicit platform publication, only from the main release entry point
        type: boolean
        default: false
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: ["tests/network/common/social-agent/**", "VERSION", ".github/workflows/tests-social-agent.yml"]
  pull_request:
    branches: ["main"]
    paths: ["tests/network/common/social-agent/**", "VERSION", ".github/workflows/tests-social-agent.yml"]

concurrency:
  group: "tests-social-agent-${{ github.ref }}-${{ inputs.release && 'release' || 'ci' }}"
  cancel-in-progress: ${{ !inputs.release }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.filter.outputs.service }}
      version: ${{ steps.filter.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            service:
              - 'tests/network/common/social-agent/**'
              - '.github/workflows/tests-social-agent.yml'
            version:
              - 'VERSION'

  test:
    needs: changes
    if: inputs.release || needs.changes.outputs.service == 'true' || needs.changes.outputs.version == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install social-agent test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/network/common/social-agent/requirements.txt
      - name: Run social-agent tests
        run: |
          python -m unittest discover -s tests/network/common/social-agent/tests -p "test_*.py" -v

  docker-validate:
    needs: [changes, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: (needs.changes.outputs.service == 'true' || needs.changes.outputs.version == 'true') && github.ref != 'refs/heads/main'
    steps:
      - name: Login to Github registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check explicit release source
        if: inputs.release
        env:
          PLATFORM_RELEASE: ${{ inputs.release }}
        run: .github/scripts/check-platform-release.sh "$GITHUB_SHA" "$(cat VERSION)"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build social-agent Docker image for amd64
        uses: docker/build-push-action@v6
        with:
          context: tests/network/common/social-agent
          file: tests/network/common/social-agent/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: false
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}/social-agent:sha-${{ github.sha }}

  publish:
    needs: [changes, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: (inputs.release || needs.changes.outputs.service == 'true' || needs.changes.outputs.version == 'true') && github.ref == 'refs/heads/main'
    steps:
      - name: Login to Github registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check explicit release source
        if: inputs.release
        env:
          PLATFORM_RELEASE: ${{ inputs.release }}
        run: .github/scripts/check-platform-release.sh "$GITHUB_SHA" "$(cat VERSION)"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Resolve version
        id: version
        run: |
          echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "ghcr.io/${GITHUB_REPOSITORY}/social-agent:latest" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.release }}" = true ]; then
            echo "ghcr.io/${GITHUB_REPOSITORY}/social-agent:$(cat VERSION)" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: tests/network/common/social-agent
          file: tests/network/common/social-agent/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.version.outputs.tags }}
